<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Waveform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="products">

  <nav class="nav">
    <a href="index.html" class="nav__logo">Waveform</a>
    <div class="nav__links">
      <a href="index.html" class="nav__link">Home</a>
      <a href="products.html" class="nav__link active">Shop</a>
      <a href="wishlist.html" class="nav__link nav__icon-link">Wishlist <span id="wishBadge" class="nav__badge" hidden>0</span></a>
      <a href="cart.html" class="nav__link nav__icon-link">Cart <span id="cartBadge" class="nav__badge" hidden>0</span></a>
    </div>
  </nav>

  <section class="section">
    <div class="section__head">
      <h2 class="section__title">Shop everything</h2>
    </div>

    <div class="pills" id="categoryPills"></div>
    <br />

    <div class="toolbar">
      <div class="search-box">
        <span>&#128269;</span>
        <input type="text" id="searchInput" placeholder="Search products..." />
      </div>
      <select id="sortSelect" class="sort-select">
        <option value="default">Sort: Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A to Z</option>
      </select>
    </div>

    <p class="empty-state" id="emptyState" hidden>No products match your search.</p>
    <div class="grid" id="productGrid"></div>
  </section>

  <footer class="footer">
    Waveform — a student project built for learning. Not a real store.
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
