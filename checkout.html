<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Waveform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="checkout">

  <nav class="nav">
    <a href="index.html" class="nav__logo">Waveform</a>
    <div class="nav__links">
      <a href="index.html" class="nav__link">Home</a>
      <a href="products.html" class="nav__link">Shop</a>
      <a href="wishlist.html" class="nav__link nav__icon-link">Wishlist <span id="wishBadge" class="nav__badge" hidden>0</span></a>
      <a href="cart.html" class="nav__link nav__icon-link">Cart <span id="cartBadge" class="nav__badge" hidden>0</span></a>
    </div>
  </nav>

  <section class="section">
    <div class="section__head">
      <h2 class="section__title">Checkout</h2>
    </div>

    <div class="checkout-layout" id="checkoutLayout">
      <form id="checkoutForm" novalidate>
        <h3 style="font-family: var(--font-display); margin-bottom: 1rem;">Shipping details</h3>

        <div class="form-group">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" required />
          <span class="form-error" id="fullNameError"></span>
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" required />
          <span class="form-error" id="addressError"></span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" required />
            <span class="form-error" id="cityError"></span>
          </div>
          <div class="form-group">
            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" required />
            <span class="form-error" id="pincodeError"></span>
          </div>
        </div>

        <h3 style="font-family: var(--font-display); margin: 1.5rem 0 1rem;">Payment (demo)</h3>

        <div class="form-group">
          <label for="cardNumber">Card number</label>
          <input type="text" id="cardNumber" placeholder="4242 4242 4242 4242" required />
          <span class="form-error" id="cardNumberError"></span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="expiry">Expiry</label>
            <input type="text" id="expiry" placeholder="MM/YY" required />
            <span class="form-error" id="expiryError"></span>
          </div>
          <div class="form-group">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" placeholder="123" required />
            <span class="form-error" id="cvvError"></span>
          </div>
        </div>

        <button type="submit" class="btn btn--accent btn--full">Place order</button>
      </form>

      <div class="summary-card">
        <h3 style="font-family: var(--font-display); margin-bottom: 1rem;">Order summary</h3>
        <div id="checkoutSummary"></div>
      </div>
    </div>

    <div class="confirmation" id="confirmation" hidden>
      <div class="confirmation__icon">&#127925;</div>
      <h2 class="confirmation__title">Order placed!</h2>
      <p class="confirmation__sub">This is a demo checkout — no real payment was made. Thanks for trying Waveform.</p>
      <a href="index.html" class="btn btn--primary">Back to home</a>
    </div>
  </section>

  <footer class="footer">
    Waveform — a student project built for learning. Not a real store.
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
