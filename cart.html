<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — Waveform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="cart">

  <nav class="nav">
    <a href="index.html" class="nav__logo">Waveform</a>
    <div class="nav__links">
      <a href="index.html" class="nav__link">Home</a>
      <a href="products.html" class="nav__link">Shop</a>
      <a href="wishlist.html" class="nav__link nav__icon-link">Wishlist <span id="wishBadge" class="nav__badge" hidden>0</span></a>
      <a href="cart.html" class="nav__link nav__icon-link active">Cart <span id="cartBadge" class="nav__badge" hidden>0</span></a>
    </div>
  </nav>

  <section class="section">
    <div class="section__head">
      <h2 class="section__title">Your cart</h2>
    </div>

    <div class="cart-layout">
      <div id="cartItems"></div>

      <div class="summary-card" id="cartSummary" hidden>
        <div class="summary-row"><span>Subtotal</span><span id="subtotalValue">\u20b90</span></div>
        <div class="summary-row"><span>Shipping</span><span id="shippingValue">\u20b90</span></div>
        <div class="summary-row summary-row--total"><span>Total</span><span id="totalValue">\u20b90</span></div>
        <a href="checkout.html" class="btn btn--accent btn--full" style="margin-top: 1rem;">Proceed to checkout</a>
      </div>
    </div>
  </section>

  <footer class="footer">
    Waveform — a student project built for learning. Not a real store.
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
